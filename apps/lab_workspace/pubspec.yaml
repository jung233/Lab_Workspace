name: lab_workspace
description: Native Lab Workspace application for Windows, Android, and iOS.
publish_to: none
version: 2.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  lab_core:
    path: ../../packages/lab_core
  cryptography: 2.9.0
  file_picker: 13.1.0
  flutter_secure_storage: 11.2.0
  flutter_local_notifications: 22.3.2
  image: 4.12.0
  path_provider: 2.1.5
  timezone: 0.11.2

dev_dependencies:
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
